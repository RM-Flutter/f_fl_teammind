  mobile_scanner: ^7.1.4
  network_info_plus: ^7.0.0
  nfc_manager: ^4.1.1
  package_info_plus: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  provider: ^6.1.2
  qr_flutter: ^4.1.0
