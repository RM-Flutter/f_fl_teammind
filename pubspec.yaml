name: app_test
description: "Attendance System for Companies."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^8.2.0

  # Web / URL
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.11
  webview_flutter_wkwebview: ^3.23.5
  flutter_custom_tabs: ^2.4.1
  url_launcher: ^6.3.2

  gal: ^2.3.2


  # Firebase
  cloud_firestore: ^6.1.1
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  firebase_analytics: ^12.1.0

  # Network
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  http: ^1.6.0
  http_parser: ^4.1.2
  connectivity_plus: ^6.1.1
  internet_connection_checker: ^3.0.1
  network_info_plus: ^7.0.0

  # State Management
  flutter_bloc: ^9.1.1
  provider: ^6.1.5+1
  equatable: ^2.0.7
  collection: ^1.19.1

  # Storage
  shared_preferences: ^2.5.4
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^10.3.8
  open_filex: ^4.7.0

  # Media / Camera / ML
  camera: ^0.11.3
  image_picker: ^1.2.1
  image: ^4.7.2
  flutter_image_compress: ^2.4.0
  video_thumbnail: ^0.5.6
  record: ^6.1.2
  just_audio: ^0.10.5
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.12.1

  # UI
  flutter_svg: ^2.2.3
  font_awesome_flutter: ^10.12.0
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fluttertoast: ^9.0.0
  flutter_styled_toast: ^2.3.0
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0
  auto_animated: ^3.2.0
  graphview: ^1.5.1

  # Localization
  easy_localization: ^3.0.8
  intl: ^0.20.2
  country_code_picker: ^3.4.1
  country_codes: ^3.3.0
  intl_phone_field: ^3.2.0

  # Device / System
  device_info_plus: ^12.3.0

  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  app_settings: ^6.0.0
  clipboard: ^3.0.9
  local_auth: ^2.3.0


  # Location / NFC / Wifi
  geolocator: ^14.0.1
  geocoding: ^4.0.0
  location: ^7.0.0
  wifi_iot: ^0.3.19+2
  wifi_scan: ^0.4.1+2
  nfc_manager: ^4.1.1
  flutter_blue_plus: ^2.1.0


  # QR / Scanner
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4

  # PDF
  flutter_pdfview: ^1.4.3
  syncfusion_flutter_pdf: ^32.1.21
  syncfusion_flutter_pdfviewer: ^32.1.21
  syncfusion_flutter_calendar: ^32.1.21
  youtube_player_flutter: ^9.1.3

  # HTML
  flutter_html: ^3.0.0

  # Routing
  go_router: ^17.0.1

  # Utils
  uuid: ^4.5.2
  mime: ^2.0.0
  yaml: ^3.1.3

  dartz: ^0.10.1
  flutter_widget_from_html: ^0.17.1
  universal_html: ^2.2.4
  html: ^0.15.6

  # Notifications
  flutter_local_notifications: ^19.5.0

  # Monitoring
  sentry_flutter: ^9.9.1

dev_dependencies:
  flutter_launcher_icons: 0.13.1
  flutter_lints: 3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/models/
    - assets/icons/
    - assets/images/
    - assets/json/
    - assets/json/lang/
    - pubspec.yaml
    - assets/images/alerts_images/
    - assets/images/svg/
    - assets/images/png/
    - assets/images/splash_images/
    - assets/images/general_images/
    - assets/images/onboarding_images/
    - assets/images/login_images/
    - assets/images/home_images/
    - assets/images/home_images/bottom_bar_images/
    - assets/images/home_images/floating_actions_buttons_images/
    - assets/images/home_images/appbar_images/
    - assets/images/notifications_images/
    - assets/images/profiles_images/
    - assets/images/company_info_images/
    - assets/images/reward_penalties_images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Black.ttf
        - asset: assets/fonts/poppins/Poppins-BlackItalic.ttf
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
        - asset: assets/fonts/poppins/Poppins-BoldItalic.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraBoldItalic.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraLightItalic.ttf
        - asset: assets/fonts/poppins/Poppins-Italic.ttf
        - asset: assets/fonts/poppins/Poppins-Light.ttf
        - asset: assets/fonts/poppins/Poppins-LightItalic.ttf
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
        - asset: assets/fonts/poppins/Poppins-MediumItalic.ttf
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
        - asset: assets/fonts/poppins/Poppins-SemiBoldItalic.ttf
        - asset: assets/fonts/poppins/Poppins-Thin.ttf
        - asset: assets/fonts/poppins/Poppins-ThinItalic.ttf
    - family: Montserrat-Arabic
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Arabic.ttf
    - family: Ibrand
      fonts:
        - asset: assets/fonts/ibrand/Ibrand-Regular.otf
